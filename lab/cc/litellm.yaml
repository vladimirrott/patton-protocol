# Anthropic Messages in, Groq chat completions out. The Groq key reaches only this proxy, through its
# environment; the container that runs the worker never sees it.
model_list:
  - model_name: gpt-oss-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
# Retries stay off: LiteLLM's router retries twice by default, and a retry the recorder cannot see is spend the
# meter cannot count. Claude Code retries on its own, through the recorder.
litellm_settings:
  drop_params: true
  telemetry: false
  num_retries: 0
  callbacks: strip_thinking.proxy_handler_instance
router_settings:
  num_retries: 0
general_settings: {}
