name: ✨ Feature or adapter request
description: Propose a new capability, a new host adapter, or a change to the protocol itself
title: "[Feature] <title>"
labels: ["enhancement"]
body:
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      options:
        - label: I have searched the existing issues
          required: true
  - type: dropdown
    attributes:
      label: What kind of change is this?
      options:
        - New host adapter
        - New validator check
        - Change to the core protocol (SKILL.md / references)
        - Something else
    validations:
      required: true
  - type: textarea
    attributes:
      label: What problem does this solve?
      description: Describe the gap. If this is a new adapter, name the host and link to its skill/agent documentation.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed approach
      description: Sketch the shape of the change. For a new adapter, the existing files under adapters/ are the closest template.
    validations:
      required: false
