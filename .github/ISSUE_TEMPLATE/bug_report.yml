name: 🐞 Bug report
description: Something in the protocol, the validator, or an adapter is wrong or inconsistent
title: "[Bug] <title>"
labels: ["bug"]
body:
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if this has already been reported.
      options:
        - label: I have searched the existing issues
          required: true
  - type: textarea
    attributes:
      label: What's wrong
      description: A concise description of the problem. If it's a contradiction between two documents, name both.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Where
      description: File and section (SKILL.md, a references/*.md file, an adapters/*.md file, or scripts/validate_protocol.py).
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
      description: What should it say or do instead?
    validations:
      required: false
  - type: textarea
    attributes:
      label: Validator output, if relevant
      description: Paste the output of `python3 scripts/validate_protocol.py .` if the bug involves validation.
      render: text
    validations:
      required: false
